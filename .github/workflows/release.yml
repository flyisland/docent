name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary
        shell: bash
        run: |
          binary="${CARGO_TARGET_DIR}/${{ matrix.target }}/release/docent"
          echo "Checking: ${binary}"
          test -x "${binary}"

      - name: Package
        shell: bash
        run: |
          target="${{ matrix.target }}"
          tag="${GITHUB_REF_NAME}"
          archive="docent-${tag}-${target}.tar.gz"

          mkdir -p dist
          cp "${CARGO_TARGET_DIR}/${target}/release/docent" dist/
          cp README.md dist/
          tar -czf "${archive}" -C dist .
          echo "ASSET=${archive}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: flyisland/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Compute SHA256 for each platform
        id: sha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          base="https://github.com/flyisland/docent/releases/download/${tag}"

          get_sha() {
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" "$1" \
              | sha256sum | awk '{print $1}'
          }

          echo "aarch64_darwin=$(get_sha "${base}/docent-${tag}-aarch64-apple-darwin.tar.gz")" >> "${GITHUB_OUTPUT}"
          echo "x86_64_darwin=$(get_sha "${base}/docent-${tag}-x86_64-apple-darwin.tar.gz")" >> "${GITHUB_OUTPUT}"
          echo "aarch64_linux=$(get_sha "${base}/docent-${tag}-aarch64-unknown-linux-musl.tar.gz")" >> "${GITHUB_OUTPUT}"
          echo "x86_64_linux=$(get_sha "${base}/docent-${tag}-x86_64-unknown-linux-musl.tar.gz")" >> "${GITHUB_OUTPUT}"

      - name: Update Formula
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          base="https://github.com/flyisland/docent/releases/download/${tag}"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/docent.rb << EOF
          class Docent < Formula
            desc "CLI tool for checking consistency across project documentation and code"
            homepage "https://github.com/flyisland/docent"
            version "${version}"

            on_macos do
              if Hardware::CPU.arm?
                url "${base}/docent-${tag}-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha.outputs.aarch64_darwin }}"
              else
                url "${base}/docent-${tag}-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha.outputs.x86_64_darwin }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${base}/docent-${tag}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${{ steps.sha.outputs.aarch64_linux }}"
              else
                url "${base}/docent-${tag}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${{ steps.sha.outputs.x86_64_linux }}"
              end
            end

            def install
              bin.install "docent"
            end

            test do
              system "#{bin}/docent", "--version"
            end
          end
          EOF

      - name: Commit and push
        shell: bash
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/docent.rb
          git commit -m "docent ${GITHUB_REF_NAME}"
          git push
